<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
      integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="/styles.css" />

    <title>Foxglove Image Processor</title>

    <style>
      /* Page-specific layout tweaks that still honour the site palette */
      .foxglove-canvas {
        width: 100%;
        height: auto;
        border: 1px dashed var(--peach);
        border-radius: var(--radius);
        display: block;
        background: var(--bg-card);
      }
      #downloadLink {
        display: none;
        margin-top: 1rem;
      }
      #status {
        font-weight: 600;
        min-height: 1.5rem;
      }
      input[type="file"] {
        width: auto;
        display: inline-block;
        margin-bottom: 0;
      }
    </style>
  </head>

  <body>
    <header>
      <nav class="navbar navbar-expand-lg navbar-dark">
        <a class="navbar-brand" style="margin-left: 0.5rem" href="/#"
          >AM's Portfolio</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="/aboutme">About Me</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/blog">Blog</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/foxglove">To Foxglove</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>

    <main class="p-4">
      <div class="container">
        <h1>Foxglove Image Processor</h1>
        <p>
          Upload an image, submit it, and watch the backend process it in real
          time.
        </p>

        <div class="card mb-4">
          <div class="card-body">
            <div class="form-inline mb-3">
              <input
                type="file"
                id="imageInput"
                class="form-control-file mr-3"
                accept="image/*"
              />
              <button id="submitBtn" class="btn btn-primary">Submit</button>
            </div>
            <div id="status">Select an image to begin.</div>
          </div>
        </div>

        <div class="row">
          <div class="col-md-6 mb-4">
            <div class="card h-100">
              <div class="card-body">
                <h2>Uploaded Image</h2>
                <canvas id="uploadCanvas" class="foxglove-canvas"></canvas>
              </div>
            </div>
          </div>
          <div class="col-md-6 mb-4">
            <div class="card h-100">
              <div class="card-body">
                <h2>Processing Preview</h2>
                <canvas id="resultCanvas" class="foxglove-canvas"></canvas>
                <a
                  id="downloadLink"
                  class="btn btn-secondary"
                  href="#"
                  download="processed-image.svg"
                  >Download Final Image</a
                >
              </div>
            </div>
          </div>
        </div>

        <a href="/">Back to main page</a>
      </div>
    </main>

    <script>
      const imageInput = document.getElementById("imageInput");
      const submitBtn = document.getElementById("submitBtn");
      const uploadCanvas = document.getElementById("uploadCanvas");
      const resultCanvas = document.getElementById("resultCanvas");
      const downloadLink = document.getElementById("downloadLink");
      const status = document.getElementById("status");

      const uploadCtx = uploadCanvas.getContext("2d");
      const resultCtx = resultCanvas.getContext("2d");

      /** Draw an image source onto a canvas, sizing the canvas to fit. */
      function drawToCanvas(canvas, ctx, src) {
        const img = new Image();
        img.onload = () => {
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0);
        };
        img.onerror = () => {
          status.textContent = "Failed to load an image frame.";
        };
        img.src = src;
      }

      /** Show a preview of the selected file on the upload canvas. */
      imageInput.addEventListener("change", () => {
        const file = imageInput.files[0];
        if (!file) return;
        status.textContent = `Ready: ${file.name}`;
        downloadLink.style.display = "none";
        const objectUrl = URL.createObjectURL(file);
        drawToCanvas(uploadCanvas, uploadCtx, objectUrl);
        setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
      });

      /** Submit the image and start listening for interim results. */
      submitBtn.addEventListener("click", async () => {
        const file = imageInput.files[0];
        if (!file) {
          status.textContent = "Please select an image first.";
          return;
        }

        submitBtn.disabled = true;
        status.textContent = "Uploading image...";
        downloadLink.style.display = "none";

        const formData = new FormData();
        formData.append("image", file);

        try {
          const response = await fetch("/foxglove/upload", {
            method: "POST",
            body: formData,
          });

          if (response.status === 201) {
            status.textContent =
              "Accepted by server. Waiting for processing updates...";
            startEventStream();
          } else {
            const text = await response.text();
            status.textContent = `Upload failed: ${response.status} ${text}`;
            submitBtn.disabled = false;
          }
        } catch (err) {
          status.textContent = `Upload error: ${err.message}`;
          submitBtn.disabled = false;
        }
      });

      /** Open an SSE connection to receive interim and final images. */
      function startEventStream() {
        const es = new EventSource("/foxglove/stream");

        es.addEventListener("interim", (event) => {
          drawToCanvas(resultCanvas, resultCtx, event.data);
          status.textContent = "Processing...";
        });

        es.addEventListener("complete", (event) => {
          es.close();
          try {
            const payload = JSON.parse(event.data);
            const finalImage = payload.image;
            drawToCanvas(resultCanvas, resultCtx, finalImage);
            downloadLink.href = finalImage;
            downloadLink.style.display = "inline-block";
            status.textContent =
              "Processing complete. Download the final image below.";
          } catch (err) {
            status.textContent = "Received final frame but could not parse it.";
          }
          submitBtn.disabled = false;
        });

        es.addEventListener("error", () => {
          es.close();
          status.textContent = "Lost connection to processing stream.";
          submitBtn.disabled = false;
        });
      }
    </script>
  </body>
</html>
